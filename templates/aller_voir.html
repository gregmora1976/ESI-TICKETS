<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ESI ALLER VOIR - Prototype</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#203047;background:#f3f6fb;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.top{background:#123d70;color:white;padding:16px max(18px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:21px;letter-spacing:.5px}.brand small{font-weight:400;display:block;font-size:11px;letter-spacing:0;color:#d6e4f5;margin-top:3px}.status{font-size:12px;background:#275782;padding:8px 10px;border-radius:30px}.app{max-width:1180px;margin:auto;padding:18px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px}.nav{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:12px;align-self:start;position:sticky;top:14px}.nav button{display:block;text-align:left;width:100%;border:0;background:none;border-radius:10px;padding:14px 12px;color:#52657c;margin:3px 0}.nav button.active{background:#e5f0ff;color:#1552a1;font-weight:750}.main{min-width:0}.panel{background:white;border:1px solid #e0e7ef;border-radius:16px;padding:24px;margin-bottom:14px;box-shadow:0 5px 22px #102d5010}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}h1{font-size:24px;margin:0;color:#173d6b}h2{font-size:17px;margin:0 0 16px;color:#1a436f}h3{font-size:15px;margin:0 0 8px}.muted{color:#62758e;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}label{display:block;font-size:12px;font-weight:700;color:#426385;margin-bottom:6px}input,textarea,select{width:100%;border:1px solid #b7cde5;border-radius:10px;background:#fbfdff;color:#182e48;padding:12px;outline-offset:1px;min-height:45px}textarea{min-height:90px;resize:vertical}.field{margin-bottom:15px}.btn{border:1px solid #1c65bb;border-radius:10px;padding:11px 16px;background:#1b64b8;color:#fff;font-weight:700;min-height:44px}.btn.ghost{background:white;color:#215c9d;border-color:#abc4e0}.btn.danger{background:#fff;color:#9c2a3b;border-color:#e3b3bd}.btn.small{padding:7px 10px;min-height:36px;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.pill{background:#e9eff7;color:#4c6177;border-radius:30px;font-size:12px;padding:6px 11px;white-space:nowrap}.pill.green{background:#e2f5e9;color:#216940}.pill.orange{background:#fff1d9;color:#935e11}.metric{padding:20px;border-radius:12px;background:#eff5ff}.metric strong{display:block;font-size:28px;color:#1b5594;margin:9px 0}.visit{border:1px solid #dce6ef;border-radius:13px;padding:15px;margin-top:10px;display:flex;gap:10px;align-items:center;justify-content:space-between}.visit strong{display:block;margin-bottom:4px}.empty{padding:28px;text-align:center;color:#65788f;background:#f7faff;border-radius:12px}.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabbar button{background:#f1f5fa;border:1px solid #d9e5f0;border-radius:9px;padding:10px 13px;color:#315678}.tabbar button.active{background:#1c64b8;color:#fff}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}.photo{border:1px solid #dce7f0;border-radius:10px;padding:7px}.photo img{width:100%;height:110px;object-fit:cover;border-radius:7px}.photo small{display:block;color:#63758b;overflow-wrap:anywhere;padding:5px 0}.hint{background:#fff7e8;border-left:3px solid #e5a132;padding:12px;border-radius:8px;font-size:13px;color:#76552e;margin-bottom:18px}.sections{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}.section{padding:9px 13px;border-radius:20px;background:#edf3f9;color:#536e8a;font-size:12px}.note{margin-top:18px;font-size:12px;color:#687e97}.hide{display:none!important}@media(max-width:760px){.top{padding:15px}.brand{font-size:18px}.status{font-size:10px}.app{display:block;padding:12px 12px 100px}.nav{position:fixed;bottom:0;top:auto;left:0;right:0;border-radius:16px 16px 0 0;display:flex;z-index:20;justify-content:space-around;padding:8px 5px env(safe-area-inset-bottom);box-shadow:0 -4px 18px #1f334522}.nav button{text-align:center;padding:12px 4px;font-size:12px;flex:1}.panel{padding:17px}.grid{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.heading{align-items:start}h1{font-size:21px}.btn{flex:1}.visit{align-items:flex-start;flex-direction:column}.visit .btn{width:100%}}

/* Correctif tablette : les deux blocs manuscrits restent dans la fiche. */
.main, .panel { min-width: 0; max-width: 100%; }
.sketch-box { box-sizing: border-box; width: 100%; max-width: 100%; min-width: 0; overflow: hidden; border: 1px solid #dce6ef; border-radius: 12px; background: #f9fbfe; padding: 10px; margin: 12px 0 18px; }
.sketch-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.sketch-toolbar .left { min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.sketch-canvas { display: block; box-sizing: border-box; width: 100%; max-width: 100%; min-width: 0; height: 240px; border: 1px dashed #abc4e0; border-radius: 9px; background: #fff; touch-action: none; }
.sketch-meta { color: #65788f; font-size: 12px; }
@media (max-width: 760px) { .sketch-box { padding: 8px; } .sketch-canvas { height: 210px; } }
</style></head><body>
<header class="top"><div class="brand">ESI ALLER VOIR<small>Compte rendu technique & préparation des interventions</small></div><div id="status" class="status">Synchronisation terrain</div></header>
<div class="app"><nav class="nav" aria-label="Navigation principale"><button data-page="home" class="active">⌂ Accueil</button><button data-page="visit">▤ Visite</button><button data-page="artworks">▧ Œuvres</button><button data-page="overview">✓ Synthèse</button></nav><main class="main" id="screen"></main></div>
<script>
'use strict';
const KEY='esi_av_tickets_connected_v1';let db=[];let selectedId=null;let artworkIndex=0;let page='home';let saveTimer;
const empty=()=>({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),number:'',client:'',preteur:'',project:'',site:'',access:'',difficulty:'standard',generalMethod:'',generalPhotos:[],generalSketch:'',humanCount:'',totalHours:'',equipmentList:'',date:new Date().toISOString().slice(0,10),owner:'',mode:'rapid',purpose:'devis',notes:'',artworks:[],status:'brouillon',updated:Date.now()});
try{const raw=JSON.parse(localStorage.getItem(KEY));db=Array.isArray(raw)?raw.filter(v=>v.module==='Demande Aller voir'):[]}catch(e){db=[]}
selectedId=null;
const SERVER_MODE=location.protocol.startsWith('http');
let remoteSaveTimer=null;
async function loadTickets(){
 if(!SERVER_MODE){document.getElementById('status').textContent='Hors serveur : ouvrir via ESI TICKETS';render();return}
 try{
  const resp=await fetch('/api/aller-voir/tickets',{cache:'no-store'});
  if(!resp.ok)throw Error('Tickets indisponibles ('+resp.status+')');
  const tickets=await resp.json();
  if(!Array.isArray(tickets))throw Error('Réponse tickets invalide');
  const originals=new Map(db.map(v=>[v.id,v]));
  // La liste est issue du serveur, jamais du cache local. Les donnees terrain
  // du cache restent recuperables pour les seuls tickets toujours autorises.
  db=tickets.filter(t=>t.module==='Demande Aller voir' && t.ticketStatus!=='Annulé').map(t=>{
    const previous=originals.get(t.id)||{};
    return {...previous,...t,id:t.id,number:t.number,client:t.client,preteur:t.preteur||'',project:t.project,owner:t.owner,
       artworks:previous.artworks||[],generalPhotos:previous.generalPhotos||[]};
  });
  const wanted=new URLSearchParams(location.search).get('ticket');
  if(wanted){
    if(!db.some(v=>v.id===wanted)){const r=await fetch('/api/aller-voir/'+encodeURIComponent(wanted));if(r.ok){const data=await r.json();db.unshift(data)}}
    if(db.some(v=>v.id===wanted)){await openVisit(wanted)}else{render();alert('Ce ticket ALLER VOIR est introuvable.');}
  }else render();
  document.getElementById('status').textContent='Tickets connectés';
 }catch(e){document.getElementById('status').textContent='Connexion impossible';console.error(e);render()}
}
async function refreshAVRecord(id){
 const r=await fetch('/api/aller-voir/'+encodeURIComponent(id),{cache:'no-store'});
 if(!r.ok){const err=await r.json().catch(()=>({}));throw Error((err.error||'Chargement impossible')+' ('+r.status+')')}
 const remote=await r.json();const idx=db.findIndex(v=>v.id===id);
 if(idx>=0)db[idx]={...db[idx],...remote};
}
function current(){return db.find(v=>v.id===selectedId)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('status').textContent='✓ Sauvé sur cet appareil'}catch(e){document.getElementById('status').textContent='⚠ Sauvegarde locale impossible';alert('Stockage local saturé : retirez quelques photos ou exportez vos données.')}}
function touch(){let v=current();if(!v)return;v.updated=Date.now();clearTimeout(saveTimer);saveTimer=setTimeout(persist,250);if(SERVER_MODE){clearTimeout(remoteSaveTimer);remoteSaveTimer=setTimeout(()=>saveAVRecord(false),1600)}document.getElementById('status').textContent='Enregistrement…'}
async function saveAVRecord(showMessage=false){const v=current();if(!v||!SERVER_MODE)return;try{const r=await fetch('/api/aller-voir/'+encodeURIComponent(v.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});const data=await r.json();if(!r.ok)throw Error(data.error||'Echec de sauvegarde');document.getElementById('status').textContent='✓ Synchronisé';if(showMessage)alert('Compte rendu enregistré dans Supabase')}catch(e){document.getElementById('status').textContent='⚠ Non synchronisé';if(showMessage)alert(e.message)}}
function go(p){if(p!=='home'&&!current()){page='home';render();return;}page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'instant'})}
async function openVisit(id,p='visit'){selectedId=id;artworkIndex=0;if(SERVER_MODE){try{await refreshAVRecord(id)}catch(e){alert(e.message);return}}go(p)}
// Pas de création manuelle : les visites seront alimentées par les tickets ALLER VOIR.
function input(name,label,val,type='text',opts=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" data-field="${name}" type="${type}" value="${esc(val)}" ${opts}></div>`}
function select(name,label,val,options){return `<div class="field"><label for="${name}">${label}</label><select id="${name}" data-field="${name}">${options.map(([id,txt])=>`<option value="${esc(id)}" ${id===val?'selected':''}>${esc(txt)}</option>`).join('')}</select></div>`}
function textArea(name,label,val,placeholder=''){return `<div class="field"><label for="${name}">${label}</label><textarea id="${name}" data-field="${name}" placeholder="${esc(placeholder)}">${esc(val)}</textarea></div>`}
function sketchBlock(id,title,subtitle=''){return `<div class="sketch-box"><div class="sketch-toolbar"><div class="left"><strong>${title}</strong><span class="sketch-meta">${subtitle}</span></div><div class="left"><button type="button" class="btn ghost small" onclick="undoPad('${id}')">Annuler le trait</button><button type="button" class="btn ghost small" onclick="clearPad('${id}')">Effacer</button></div></div><canvas id="${id}" class="sketch-canvas" width="900" height="360"></canvas><p class="note">Écrivez ou dessinez directement au doigt ou au stylet. Idéal pour les notes rapides, croquis d’accès ou repères terrain.</p></div>`}
function initPad(id,data,onSave){const canvas=document.getElementById(id);if(!canvas)return;const ctx=canvas.getContext('2d');const dpr=Math.max(1,window.devicePixelRatio||1);const rect=canvas.getBoundingClientRect();const cssW=Math.max(1,Math.round(rect.width||canvas.clientWidth||canvas.width));const cssH=Math.max(180,Math.round(rect.height||canvas.height));canvas.width=cssW*dpr;canvas.height=cssH*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#173d6b';ctx.lineWidth=2.2;const history=[];function clearAll(push=true){ctx.clearRect(0,0,cssW,cssH);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cssW,cssH);if(push)history.push(canvas.toDataURL('image/png'))}function restore(url,push=false){const img=new Image();img.onload=()=>{ctx.clearRect(0,0,cssW,cssH);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cssW,cssH);ctx.drawImage(img,0,0,cssW,cssH);if(push)history.push(canvas.toDataURL('image/png'))};img.src=url}if(data){restore(data,true)}else{clearAll(true)}let drawing=false,lastX=0,lastY=0;function pos(e){const r=canvas.getBoundingClientRect();const pt=e.touches?e.touches[0]:e;return {x:pt.clientX-r.left,y:pt.clientY-r.top}}function start(e){drawing=true;const p=pos(e);lastX=p.x;lastY=p.y;e.preventDefault()}function move(e){if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y;e.preventDefault()}function end(){if(!drawing)return;drawing=false;const url=canvas.toDataURL('image/png');history.push(url);onSave(url)}canvas.onpointerdown=start;canvas.onpointermove=move;window.addEventListener('pointerup',end,{once:false});canvas.ontouchstart=start;canvas.ontouchmove=move;canvas.ontouchend=end;canvas.__pad={history,onSave,restore,clearAll,getData:()=>canvas.toDataURL('image/png')}}
function clearPad(id){const canvas=document.getElementById(id);if(!canvas||!canvas.__pad)return;if(!confirm('Effacer cette note manuscrite ?'))return;canvas.__pad.clearAll();canvas.__pad.onSave('')}
function undoPad(id){const canvas=document.getElementById(id);if(!canvas||!canvas.__pad)return;const h=canvas.__pad.history;if(h.length<=1){clearPad(id);return}h.pop();const prev=h[h.length-1]||'';if(prev){canvas.__pad.restore(prev,false);canvas.__pad.onSave(prev)}else{canvas.__pad.clearAll(false);canvas.__pad.onSave('')}}
function render(){const root=document.getElementById('screen');let v=current();if(page!=='home'&&!v){root.innerHTML='<div class="panel"><h1>Aucune visite sélectionnée</h1><p class="muted">Sélectionnez un ticket ALLER VOIR depuis l’accueil.</p><button class="btn ghost" onclick="go(&quot;home&quot;)">Retour à l’accueil</button></div>';return}
if(page==='home'){root.innerHTML=`<section class="panel"><div class="heading"><div><h1>Mes visites terrain</h1><p class="muted">Les visites sont issues des tickets ALLER VOIR d’ESI TICKETS. Ouvrez un dossier pour compléter le compte rendu sur place.</p></div></div><div class="grid"><div class="metric">Visites affichées<strong>${db.length}</strong></div><div class="metric">Comptes rendus finalisés<strong>${db.filter(x=>x.status==='termine').length}</strong></div></div><p class="hint">Les visites proviennent des tickets ESI TICKETS. Sélectionnez un ticket pour saisir le compte rendu terrain.</p></section><section class="panel"><h2>Tickets ALLER VOIR</h2><div class="field"><label for="search">Rechercher par dossier, client ou projet</label><input id="search" placeholder="Rechercher..." oninput="listVisits(this.value)"></div><div id="visits"></div></section>`;listVisits('');return}
if(page==='visit'){root.innerHTML=`<section class="panel"><div class="heading"><div><h1>Visite – Environnement général</h1><p class="muted">Dossier ${esc(v.number||'sans numéro')} · ${esc(v.client||'Client')} · ${esc(v.project||'Projet')}</p></div><span class="pill ${v.status==='termine'?'green':'orange'}">${v.status==='termine'?'CR finalisé':'En cours'}</span></div><div class="hint">Les informations du dossier proviennent du ticket et sont présentées en lecture seule. Les observations sont sauvegardées dans ESI TICKETS. Une copie de travail reste sur cet appareil.</div><div class="grid"><div class="field"><label>N° dossier</label><input readonly value="${esc(v.number)}"></div><div class="field"><label>Client</label><input readonly value="${esc(v.client)}"></div><div class="field"><label>Projet</label><input readonly value="${esc(v.project)}"></div><div class="field"><label>Chargé de projet</label><input readonly value="${esc(v.owner)}"></div>${input('date','Date de visite',v.date,'date')}${select('purpose','Objet de la visite',v.purpose,[['devis','Pour devis'],['realisation','Pour réalisation']])}</div>${input('site','Lieu / Adresse et bâtiment',v.site)}<h2>Accès et environnement</h2>${textArea('access','Accès et cheminement général',v.access,'Stationnement, accès véhicule, portails, escaliers, ascenseurs, couloirs, dimensions de passage...')}${select('difficulty','Difficulté générale de l’intervention',v.difficulty,[['standard','Simple / accès standard'],['moderate','Contraintes particulières'],['complex','Complexe / moyens spécifiques']])}${textArea('notes','Constats, contraintes et points de vigilance',v.notes,'Contraintes communes à toutes les œuvres, sécurité, autorisations, horaires...')}<h2>Compte rendu technique général</h2>${textArea('generalMethod','Déroulement et préconisations générales',v.generalMethod,'Organisation globale du chantier, déroulement, logistique et recommandations...')}<h2>Moyens humains — ensemble de l’opération</h2><div class="grid">${input('humanCount','Nombre d’hommes nécessaires',v.humanCount||'','number','min="0" step="1" inputmode="numeric"')}${input('totalHours','Durée totale de l’intervention (heures)',v.totalHours||'','number','min="0" step="0.5" inputmode="decimal"')}</div><h2>Moyens matériels — ensemble de l’opération</h2>${textArea('equipmentList','Liste du matériel nécessaire',v.equipmentList||'','Gerbeur, transpalette, paras, sangles, rampe, véhicule... une ligne par matériel')}<h2>Photos de l’environnement</h2><p class="muted">Photographiez l’accès, les escaliers, le stationnement et toutes les difficultés rencontrées.</p><div class="field"><label for="generalPhotos">Ajouter des photos terrain</label><input id="generalPhotos" type="file" accept="image/*" multiple></div><div class="photo-grid">${(v.generalPhotos||[]).map((p,i)=>`<div class="photo"><img src="${p.data}" alt="Photo environnement ${i+1}"><small>${esc(p.name)}</small><button class="btn ghost small" onclick="removeGeneralPhoto(${i})">Supprimer</button></div>`).join('')}</div><h2>Note manuscrite rapide</h2><p class="muted">Bloc libre pour écrire au stylet, noter une info rapide ou faire un croquis d’accès.</p>${sketchBlock('visitSketch','Bloc note visite','Stylet, doigt ou souris')}<div class="actions"><button class="btn" onclick="go('artworks')">Passer aux œuvres →</button><button class="btn ghost" onclick="go('home')">Retour aux tickets</button></div></section>`;bindVisitFields();initPad('visitSketch',v.generalSketch,url=>{current().generalSketch=url;touch();persist()});document.getElementById('generalPhotos').addEventListener('change',addGeneralPhotos);return}
if(page==='artworks'){let a=v.artworks[artworkIndex];root.innerHTML=`<section class="panel"><div class="heading"><div><h1>Œuvres et manutention</h1><p class="muted">${esc(v.client||'Client non renseigné')} · ${v.artworks.length} œuvre(s) · Les accès et le compte rendu général sont dans « Visite ».</p></div><button class="btn small" onclick="addArtwork()">+ Ajouter une œuvre</button></div>${v.artworks.length?`<div class="tabbar">${v.artworks.map((x,i)=>`<button class="${artworkIndex===i?'active':''}" onclick="artworkIndex=${i};render()">${esc(x.title||'Œuvre '+(i+1))}</button>`).join('')}</div>`:''}${a?`<div class="grid">${input('title','Titre / Désignation',a.title)}${select('category','Typologie',a.category,[['tableau','Tableau'],['sculpture','Sculpture'],['objet','Objet'],['installation','Installation'],['autre','Autre']])}</div><h2>Dimensions et caractéristiques</h2><div class="grid3">${input('length','Longueur (cm)',a.length,'number','min="0" step="any"')}${input('width','Largeur (cm)',a.width,'number','min="0" step="any"')}${input('height','Hauteur (cm)',a.height,'number','min="0" step="any"')}${input('weight','Poids (kg)',a.weight,'number','min="0" step="any"')}${input('material','Matériaux / Technique',a.material)}</div><h2>Préconisations propres à l’œuvre</h2>${textArea('method','Mode opératoire individuel',a.method,'Décrochage, protection, manutention, emballage, transport...')}${textArea('resources','Moyens humains et matériels préconisés',a.resources,'Effectif, chariot, engins, véhicule, caisse...')}<h2>Photos de l’œuvre</h2><p class="muted">Prise de photo ou import depuis la tablette. Les notes au stylet sont disponibles sous les photos.</p><div class="field"><label for="photos">Ajouter des photos</label><input id="photos" type="file" accept="image/*" multiple></div><div class="photo-grid">${(a.photos||[]).map((p,i)=>`<div class="photo"><img src="${p.data}" alt="Photo ${i+1}"><small>${esc(p.name)}</small><button class="btn ghost small" onclick="removePhoto(${i})">Supprimer</button></div>`).join('')}</div><h2>Note manuscrite / croquis rapide</h2><p class="muted">Pour noter une mesure, un détail de prise ou faire un petit schéma directement au stylet.</p>${sketchBlock('artworkSketch','Bloc note œuvre','Croquis ou note manuscrite')}<div class="actions"><button class="btn ghost danger" onclick="removeArtwork()">Supprimer cette œuvre</button><button class="btn" onclick="go('overview')">Voir la synthèse →</button></div>`:`<div class="empty">Aucune œuvre. Ajoutez la première fiche pour commencer.</div><div class="actions"><button class="btn ghost" onclick="go('overview')">Voir la synthèse</button></div>`}</section>`;if(a){bindArtworkFields();initPad('artworkSketch',a.sketch,url=>{current().artworks[artworkIndex].sketch=url;touch();persist()});document.getElementById('photos').addEventListener('change',addPhotos)}return}
if(page==='overview'){root.innerHTML=`<section class="panel"><div class="heading"><div><h1>Synthèse technique</h1><p class="muted">Aperçu du compte rendu à partir des données saisies</p></div><span class="pill ${v.status==='termine'?'green':'orange'}">${v.status==='termine'?'Terminé':'Brouillon'}</span></div><div class="grid"><p><b>N° dossier</b><br>${esc(v.number||'Non renseigné')}</p><p><b>Client</b><br>${esc(v.client||'Non renseigné')}</p><p><b>Projet</b><br>${esc(v.project||'Non renseigné')}</p><p><b>Date</b><br>${esc(v.date)}</p><p><b>Lieu</b><br>${esc(v.site||'Non renseigné')}</p><p><b>Nombre d’œuvres</b><br>${v.artworks.length}</p></div><h2>Environnement et accès</h2><p><b>Accès :</b> ${esc(v.access||'—')}</p><p><b>Difficulté :</b> ${esc(({standard:'Simple',moderate:'Contraintes particulières',complex:'Complexe'})[v.difficulty]||'—')}</p><p><b>Observations :</b> ${esc(v.notes||'—')}</p><h2>Compte rendu technique général</h2><p>${esc(v.generalMethod||'Non renseigné')}</p><h2>Moyens humains — ensemble de l’opération</h2><p><b>Nombre d’hommes :</b> ${esc(v.humanCount||'—')} · <b>Durée totale :</b> ${esc(v.totalHours||'—')} h</p><h2>Moyens matériels — ensemble de l’opération</h2><p style="white-space:pre-wrap">${esc(v.equipmentList||'—')}</p><p class="muted">${(v.generalPhotos||[]).length} photo(s) de l’environnement · ${v.generalSketch?'1 note manuscrite':'0 note manuscrite'}</p>${v.artworks.map((a,i)=>`<div class="visit" style="display:block"><h3>${i+1}. ${esc(a.title||'Œuvre sans titre')}</h3><p class="muted">${esc(a.category)} · ${esc(a.length||'?')} × ${esc(a.width||'?')} × ${esc(a.height||'?')} cm · ${esc(a.weight||'?')} kg</p><p><b>Mode opératoire :</b> ${esc(a.method||'—')}</p><p><b>Moyens :</b> ${esc(a.resources||'—')}</p><p class="muted">${(a.photos||[]).length} photo(s) · ${a.sketch?'1 note manuscrite':'0 note manuscrite'}</p></div>`).join('')}<div class="actions"><button class="btn ghost" onclick="go('artworks')">Modifier les œuvres</button><button class="btn" onclick="finalize()">${v.status==='termine'?'Mettre à jour la validation':'Terminer la visite'}</button><button class="btn" onclick="exportReport()">📄 Générer le PDF</button></div><p class="note">Le compte rendu s'ouvre dans un nouvel onglet : 1 page A4 pour la visite et 1 page A4 par œuvre. Choisissez « Enregistrer au format PDF » dans la fenêtre d'impression du navigateur. Aucun prix n'y figure. Le stockage serveur sera ajouté lors de l'intégration.</p></section>`;return}}
function listVisits(q){let list=document.getElementById('visits');if(!list)return;let x=db.filter(v=>(v.number+' '+v.client+' '+v.project).toLowerCase().includes(q.toLowerCase()));list.innerHTML=x.length?x.map(v=>`<div class="visit"><div><strong>${esc(v.number||'Sans numéro')} — ${esc(v.client||'Client à renseigner')}</strong><span class="muted">${esc(v.project||'Projet à renseigner')} · ${esc(v.date)} · ${v.artworks.length} œuvre(s)</span></div><div class="actions" style="margin:0"><span class="pill ${v.status==='termine'?'green':'orange'}">${v.status==='termine'?'Terminé':'Brouillon'}</span><button class="btn small" onclick="openVisit('${v.id}')">Ouvrir</button></div></div>`).join(''):'<div class="empty">Aucune visite trouvée.</div>'}
function bindVisitFields(){document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{current()[el.dataset.field]=el.value;touch()}))}

function addArtwork(){const v=current();v.artworks.push({title:'Œuvre '+(v.artworks.length+1),category:'tableau',length:'',width:'',height:'',weight:'',material:'',method:'',resources:'',photos:[],sketch:''});artworkIndex=v.artworks.length-1;touch();render()}

function removeGeneralPhoto(i){if(!confirm('Supprimer cette photo de la visite ?'))return;current().generalPhotos.splice(i,1);touch();render()}
async function addGeneralPhotos(e){const v=current();for(const file of [...e.target.files].slice(0,8)){if(!file.type.startsWith('image/'))continue;try{v.generalPhotos.push({name:file.name,data:await imageSmall(file)})}catch(error){alert('Photo non ajoutée : '+error.message)}}touch();persist();render();if(SERVER_MODE)saveAVRecord(false)}
function removePhoto(i){if(!confirm('Supprimer cette photo ?'))return;current().artworks[artworkIndex].photos.splice(i,1);touch();render()}
async function addPhotos(e){const a=current().artworks[artworkIndex];for(const file of [...e.target.files].slice(0,8)){if(!file.type.startsWith('image/'))continue;try{let src=await imageSmall(file);a.photos.push({name:file.name,data:src})}catch(error){alert('Photo non ajoutée : '+error.message)}}touch();persist();render();if(SERVER_MODE)saveAVRecord(false)}
function imageSmall(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(new Error('Lecture impossible'));r.onload=()=>{let image=new Image();image.onerror=()=>reject(new Error('Format non compatible'));image.onload=()=>{const scale=Math.min(1,1400/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.68))};image.src=r.result};r.readAsDataURL(file)})}
function safeImage(src){return typeof src==='string'&&/^data:image\/(png|jpeg|jpg|webp);base64,[A-Za-z0-9+/=]+$/.test(src)?src:''}
function reportText(value){return esc(value||'Non renseigné').replace(/\r?\n/g,'<br>')}
function reportPhotos(photos,label){if(!photos||!photos.length)return '';return `<h3>${esc(label)}</h3><div class="photogrid">${photos.map((p,i)=>{let src=safeImage(p.data);return src?`<figure><img src="${src}" alt="Photo ${i+1}"><figcaption>${esc(p.name||'Photo '+(i+1))}</figcaption></figure>`:''}).join('')}</div>`}
function reportSketch(src,label){src=safeImage(src);return src?`<h3>${esc(label)}</h3><figure class="sketch"><img src="${src}" alt="Note manuscrite"></figure>`:''}
function reportBlock(label,val){return `<div class="fieldline"><div class="fieldlabel">${esc(label)}</div><div>${reportText(val)}</div></div>`}
function buildReport(v, logoDataUrl){
 const categories={tableau:'Tableau',sculpture:'Sculpture',objet:'Objet',installation:'Installation',autre:'Autre'};
 const difficulty={standard:'Simple / accès standard',moderate:'Contraintes particulières',complex:'Complexe / moyens spécifiques'};
 const prettyDate=v.date?new Date(v.date+'T12:00:00').toLocaleDateString('fr-FR'):'—';

 const footer=(n,total)=>`<div class="sheetfooter"><span>ESI · COMPTE RENDU TECHNIQUE · SANS CHIFFRAGE</span><span>${n} / ${total}</span></div>`;

 const total=worksData.length+1;
 const visit=`<article class="sheet"><div class="sheetbody">${identity}<h1>Compte rendu de visite</h1><div class="subtitle">${esc(v.project||'Visite technique')} · ${esc(prettyDate)}</div><div class="facts"><div><small>CLIENT</small><strong>${esc(v.client||'—')}</strong></div><div><small>CHARGÉ DE PROJET</small><strong>${esc(v.owner||'—')}</strong></div><div><small>DATE DE VISITE</small><strong>${esc(prettyDate)}</strong></div><div><small>OBJET</small><strong>${v.purpose==='realisation'?'Préparation réalisation':'Préparation devis'}</strong></div></div><h2>Environnement général</h2>${reportBlock('Lieu / Adresse',v.site)}${reportBlock('Accès et cheminement',v.access)}${reportBlock('Difficulté',difficulty[v.difficulty]||'—')}${reportBlock('Contraintes et points de vigilance',v.notes)}<h2>Compte rendu technique général</h2>${reportBlock('Déroulement et préconisations',v.generalMethod)}<h2>Moyens humains</h2>${reportBlock('Nombre d’hommes',v.humanCount)}${reportBlock('Durée totale (heures)',v.totalHours)}<h2>Moyens matériels</h2>${reportBlock('Matériel nécessaire',v.equipmentList)}${reportPhotos(v.generalPhotos,'Photographies de la visite')}${reportSketch(v.generalSketch,'Notes manuscrites et croquis')}</div>${footer(1,total)}</article>`;
 const works=worksData.map((o,i)=>`<article class="sheet"><div class="sheetbody">${identity}<h1>Fiche œuvre ${i+1} / ${worksData.length}</h1><div class="subtitle">${esc(o.title||'Œuvre sans désignation')}</div><div class="facts"><div><small>TYPOLOGIE</small><strong>${esc(categories[o.category]||o.category||'—')}</strong></div><div><small>DIMENSIONS (CM)</small><strong>${esc(o.length||'—')} × ${esc(o.width||'—')} × ${esc(o.height||'—')}</strong></div><div><small>POIDS</small><strong>${esc(o.weight||'—')} kg</strong></div><div><small>MATÉRIAUX / TECHNIQUE</small><strong>${esc(o.material||'—')}</strong></div></div><h2>Mode opératoire individuel</h2>${reportBlock('Préconisations de manutention / emballage',o.method)}${reportBlock('Moyens humains et matériels',o.resources)}<div class="${safeImage(o.sketch)?'with-sketch':'no-sketch'}">${reportPhotos(o.photos,'Photographies de l’œuvre')}${reportSketch(o.sketch,'Notes manuscrites et croquis')}</div></div>${footer(i+2,total)}</article>`).join('');
 return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESI - CR AV ${esc(v.number||'sans numero')}</title><style>
@page{size:A4;margin:0}
*{box-sizing:border-box}html,body{margin:0}body{background:#e9eef4;color:#203047;font:10pt/1.32 Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;background:#163e6a;color:white;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:15px;z-index:5}.toolbar button{background:white;border:0;border-radius:7px;color:#163e6a;padding:10px 15px;font-weight:700;cursor:pointer}
.sheet{position:relative;background:white;width:210mm;height:297mm;padding:14mm 15mm 13mm;margin:12mm auto;box-shadow:0 2px 20px #102d5028;overflow:hidden;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}.sheetbody{width:180mm;transform-origin:top left}.identity{display:flex;align-items:center;justify-content:space-between;gap:5mm;background:#113d6e;color:white;padding:4mm 5mm;margin:-14mm -15mm 5mm;min-height:29mm}.identity-left{display:flex;align-items:center;gap:4mm;min-width:0}.identity-left img{width:28mm;height:18mm;object-fit:contain}.identity-left b{font-size:14pt;color:white;line-height:1.1}.identity-right{text-align:right;max-width:57mm;min-width:36mm;overflow-wrap:anywhere}.identity-right strong{display:block;font-size:9pt}.identity-right small{display:block;font-size:8pt;margin-top:2mm}h1{font-size:17pt;color:#123e72;margin:0 0 2mm}h2{font-size:11pt;color:#174f91;border-bottom:1px solid #ccdaea;padding-bottom:1mm;margin:4mm 0 2mm}h3{font-size:9.5pt;color:#174f91;margin:3mm 0 2mm}.subtitle{font-size:10pt;color:#627992;margin-bottom:3mm;overflow-wrap:anywhere}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2mm 5mm;background:#f2f6fb;padding:3mm;border-radius:2mm;margin:2mm 0 4mm}.facts>div{min-width:0;overflow-wrap:anywhere}.facts small{display:block;font-size:7.5pt;color:#68809a}.facts strong{display:block;font-size:9.5pt;margin-top:1mm}.fieldline{margin:2.5mm 0;overflow-wrap:anywhere}.fieldlabel{font-size:8.7pt;font-weight:700;color:#294d78;margin-bottom:.7mm}.fieldline>div:last-child{white-space:normal}.photogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2mm}.photogrid figure{margin:0;border:1px solid #d8e1ee;padding:1.5mm;min-width:0}.photogrid img{display:block;width:100%;height:45mm;object-fit:contain}.no-sketch .photogrid{grid-template-columns:repeat(2,minmax(0,1fr))}.no-sketch .photogrid img{height:80mm}.with-sketch .photogrid img{height:33mm}.with-sketch .sketch img{height:42mm}.photogrid figcaption{font-size:7pt;color:#536c85;overflow-wrap:anywhere;margin-top:1mm}.sketch{border:1px solid #dae4ef;margin:0;padding:1.5mm}.sketch img{display:block;width:100%;height:43mm;object-fit:contain}.sheetfooter{position:absolute;bottom:8mm;left:15mm;right:15mm;border-top:1px solid #d4e0ee;padding-top:2mm;display:flex;justify-content:space-between;gap:10px;color:#607991;font-size:7.2pt}
@media print{body{background:white;-webkit-print-color-adjust:exact;print-color-adjust:exact}.toolbar{display:none}.sheet{margin:0;box-shadow:none}.sheetbody{transform-origin:top left}}
@media screen and (max-width:820px){.sheet{margin:8px auto}.toolbar{font-size:12px}}
</style></head><body><div class="toolbar"><span>1 page de visite + 1 page par œuvre · Les contenus très longs sont réduits pour tenir sur une page.</span><button type="button" onclick="window.print()">Imprimer / Enregistrer PDF</button></div>${visit}${works}<script>
// Ajustement par page : conserver une seule feuille A4 par section, y compris avec plusieurs images.
function fitSheets(){document.querySelectorAll('.sheet').forEach(sheet=>{const body=sheet.querySelector('.sheetbody');body.style.transform='none';body.style.width='180mm';const cs=getComputedStyle(sheet);const height=sheet.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-24;const actual=body.scrollHeight;const factor=Math.min(1,height/Math.max(1,actual));if(factor<1){body.style.width=(180/factor)+'mm';body.style.transform='scale('+factor+')'} });}
window.addEventListener('load',()=>{fitSheets();setTimeout(fitSheets,200)});window.addEventListener('beforeprint',fitSheets);document.fonts&&document.fonts.ready.then(fitSheets);
<\/script></body></html>`;
}

async function loadReportLogo(){
 // L'aperçu est ouvert via blob: une URL relative /static/ ne fonctionne pas dans ce contexte.
 // L'image est convertie en data: URL avant la construction du document imprimable.
 for(const path of ['/static/logo.png','/static/logo.jpg']){
  try{
   const response=await fetch(path,{cache:'no-store'});
   if(!response.ok)continue;
   const blob=await response.blob();
   if(!blob.type.startsWith('image/'))continue;
   const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Lecture logo impossible'));reader.readAsDataURL(blob)});
   if(typeof data==='string'&&data.startsWith('data:image/'))return data;
  }catch(error){console.warn('Logo ESI indisponible :',path,error)}
 }
 return '';
}
async function exportReport(){
 const v=current();if(!v){alert('Aucune visite ouverte.');return}
 persist();
 // Ouverture immédiate pendant le clic pour éviter le blocage anti-popup mobile.
 const win=window.open('about:blank','_blank');
 if(!win){alert('Le navigateur bloque la fenêtre du compte rendu. Autorisez les fenêtres surgissantes, puis réessayez.');return}
 try{
  win.document.open();win.document.write('<!doctype html><html lang="fr"><meta charset="utf-8"><title>Compte rendu ESI</title><body style="font:16px Arial;padding:25px">Préparation du compte rendu…</body></html>');win.document.close();
  const logoDataUrl=await loadReportLogo();
  if(!logoDataUrl)console.warn('Logo ESI non chargé : bandeau texte de remplacement utilisé.');
  const html=buildReport(v,logoDataUrl);
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  win.location.replace(url);
  setTimeout(()=>URL.revokeObjectURL(url),120000);
 }catch(error){console.error(error);win.document.body.textContent='Impossible de préparer le compte rendu : '+error.message}
}
async function finalize(){const v=current();if(!v||!v.number.trim()||!v.artworks.length){alert('Complétez le dossier et au moins une fiche œuvre.');return}
 if(!SERVER_MODE){alert('La validation serveur nécessite ESI TICKETS.');return}
 const btn=document.querySelector('.actions button');
 try{const resp=await fetch('/api/aller-voir/'+encodeURIComponent(v.id)+'/finalize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});const json=await resp.json();if(!resp.ok)throw Error(json.error||'Erreur validation');v.status='termine';persist();render();window.open(json.pdf_url,'_blank');alert('Compte rendu finalisé et PDF disponible dans ESI TICKETS.')}catch(e){alert('Validation impossible : '+e.message)}
}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();loadTickets();
</script></body></html>
